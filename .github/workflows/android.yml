name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # empty → build.gradle.kts falls back to the LAN default
      STRIDE_API_URL: ${{ vars.STRIDE_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "ORG_GRADLE_PROJECT_versionName=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "ORG_GRADLE_PROJECT_versionCode=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing release with the provided keystore"
          else
            echo "No keystore secret: release APK is signed with the debug key"
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/stride-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/stride-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stride-apks
          path: android/dist/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: android/app/build/reports/tests/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stride-apks
          path: dist
      - name: Attach APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/stride-release.apk "dist/stride-${GITHUB_REF_NAME}.apk"
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" "dist/stride-${GITHUB_REF_NAME}.apk" --repo "$GITHUB_REPOSITORY" --clobber
