# Stride backend: its own PocketBase, separate from the shared `pocketbase`
# container and every other database on the Pi.
#
# Lives at /media/cyberhirsch/SSD/Data/Stride on the Pi (deploy.sh syncs it).
#   docker compose up -d --build                      # LAN only, port 8091
#   docker compose --profile tunnel up -d --build     # plus Cloudflare tunnel
#
# The tunnel needs TUNNEL_TOKEN in .env (see .env.example). Its public
# hostname should point at http://stride-pb:8090.
name: stride

services:
  stride-pb:
    build: .
    container_name: stride-pb
    restart: unless-stopped
    ports:
      - "8091:8090"
    volumes:
      - ./pb_data:/pb_data
      # photos prepared by tools/prepare_seed.py, read by `pocketbase import-seed`
      - ./seed:/seed:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # alignment worker on the Pi itself; slow but always on. Credentials of
  # its Stride account go in worker.env (see worker.env.example).
  #   docker compose --profile worker up -d
  stride-worker:
    image: ghcr.io/cyberhirsch/stride-worker:latest
    container_name: stride-worker
    restart: unless-stopped
    profiles: ["worker"]
    env_file: worker.env
    environment:
      STRIDE_URL: http://stride-pb:8090
      STRIDE_THREADS: "2"
    # leave the Pi's other services (Jellyfin, Immich, ...) their CPU
    cpus: 2
    cpu_shares: 256
    mem_limit: 3g
    volumes:
      - worker-tmp:/work
    depends_on:
      - stride-pb

  stride-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: stride-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    env_file: .env
    depends_on:
      - stride-pb

volumes:
  worker-tmp:
